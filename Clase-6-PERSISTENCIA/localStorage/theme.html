<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Claro/Oscuro con LocalStorage</title>
    <link rel="stylesheet" href="../../assets/base.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <style>
        body {
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
            text-align: center;
            padding: 20px;
        }
        .dark-mode {
            background: #1e1e1e;
            color: white;
        }
        .light-mode {
            background: #ffffff;
            color: black;
        }
        button {
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .dark-mode button {
            background: #ffffff;
            color: #000;
        }
        .light-mode button {
            background: #000;
            color: #fff;
        }
    </style>
</head>
<body>

    <div style="max-width:1100px;margin:1rem auto 0;padding:0 1.5rem;font-size:0.9rem;text-align:left;">
        <a href="../../index.html" style="color:#f39c12;text-decoration:none;">← Curso</a>
        &nbsp;|&nbsp;
        <a href="../index.html" style="color:#f39c12;text-decoration:none;">Clase 6</a>
        &nbsp;|&nbsp;
        <strong>LocalStorage · Modo claro/oscuro</strong>
        &nbsp;·&nbsp;
        <a href="retos.html" style="color:#f39c12;font-weight:bold;text-decoration:none;">🛠️ Ir a los retos</a>
    </div>

    <h1>🌗 Modo Claro/Oscuro</h1>
    <button id="toggleTheme">Cambiar Tema</button>

    <script>
        const body = document.body;
        const btnToggle = document.getElementById("toggleTheme");

        // 📌 Función para cambiar el tema y guardarlo en LocalStorage
        function cambiarTema() {
            const modoActual = body.classList.contains("dark-mode") ? "light-mode" : "dark-mode";
            body.className = modoActual;
            localStorage.setItem("tema", modoActual);
        }

        // 📌 Cargar tema guardado en LocalStorage al iniciar
        function cargarTema() {
            const temaGuardado = localStorage.getItem("tema") || "light-mode";
            body.className = temaGuardado;
        }

        // ✅ Agregar Event Listener al botón
        btnToggle.addEventListener("click", cambiarTema);

        // ✅ Cargar tema al abrir la página
        cargarTema();
    </script>

    <div style="max-width:1100px;margin:2rem auto 1rem;padding:1.5rem 1.75rem;background:linear-gradient(135deg,#f39c12,#f8c471);color:white;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,0.12);text-align:left;">
        <div>
            <h2 style="margin:0 0 0.3rem 0;font-size:1.25rem;">🛠️ Ya tienes la idea — ahora aplica el patrón en tus propios retos</h2>
            <p style="margin:0;opacity:0.95;">Theme switcher persistente, contador con historial y mini-app de tareas te esperan.</p>
        </div>
        <a href="retos.html" style="background:white;color:#f39c12;padding:0.7rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:bold;white-space:nowrap;">Ir a los retos →</a>
    </div>

</body>
</html>
