<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List con IndexedDB</title>
    <link rel="stylesheet" href="../../assets/base.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4; }
        h1 { color: #333; }
        button { margin: 5px; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px; width: 200px; }
        #tareas { margin-top: 20px; background: white; padding: 10px; border-radius: 5px; }
        .tarea { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #ccc; }
        .tarea button { background: red; }
    </style>
</head>
<body>
    <div style="max-width:1100px;margin:1rem auto 0;padding:0 1.5rem;font-size:0.9rem;">
        <a href="../../index.html" style="color:#006266;text-decoration:none;">← Curso</a>
        &nbsp;|&nbsp;
        <a href="../index.html" style="color:#006266;text-decoration:none;">Clase 6</a>
        &nbsp;|&nbsp;
        <a href="indexedDB.html" style="color:#006266;text-decoration:none;">IndexedDB</a>
        &nbsp;|&nbsp;
        <strong>IndexedDB · To-Do Simple</strong>
        &nbsp;·&nbsp;
        <a href="retos.html" style="color:#006266;font-weight:bold;text-decoration:none;">🛠️ Ir a los retos</a>
    </div>

    <h1>📌 To-Do List con IndexedDB</h1>
    
    <input type="text" id="nuevaTarea" placeholder="Escribe una tarea...">
    <button onclick="agregarTarea()">Agregar Tarea</button>

    <h2>📋 Tareas:</h2>
    <div id="tareas"></div>

    <script>
        let db;

        // 🔹 Abrimos o creamos la base de datos
        let request = indexedDB.open("TareasDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            db.createObjectStore("tareas", { keyPath: "id", autoIncrement: true });
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            cargarTareas(); // 📥 Cargar tareas al iniciar la app
        };

        // 📌 Agregar una nueva tarea
        function agregarTarea() {
            let tareaTexto = document.getElementById("nuevaTarea").value;
            if (!tareaTexto.trim()) return alert("Escribe una tarea");

            let transaction = db.transaction(["tareas"], "readwrite");
            let store = transaction.objectStore("tareas");

            let request = store.add({ texto: tareaTexto });

            request.onsuccess = () => { 
                document.getElementById("nuevaTarea").value = "";
                cargarTareas();
            };
        }

        // 📌 Eliminar tarea por ID
        function eliminarTarea(id) {
            let transaction = db.transaction(["tareas"], "readwrite");
            let store = transaction.objectStore("tareas");

            let request = store.delete(id);
            request.onsuccess = () => cargarTareas();
        }

        // 📌 Cargar y mostrar tareas
        function cargarTareas() {
            let transaction = db.transaction(["tareas"], "readonly");
            let store = transaction.objectStore("tareas");

            let request = store.getAll();
            request.onsuccess = function(event) {
                let tareas = event.target.result;
                let lista = tareas.map(tarea => 
                    `<div class="tarea">
                        <span>${tarea.texto}</span>
                        <button onclick="eliminarTarea(${tarea.id})">🗑️</button>
                    </div>`).join("");

                document.getElementById("tareas").innerHTML = lista || "<p>No hay tareas</p>";
            };
        }
    </script>

    <div style="max-width:1100px;margin:2rem auto 1rem;padding:1.5rem 1.75rem;background:linear-gradient(135deg,#006266,#16a085);color:white;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,0.12);">
        <div>
            <h2 style="margin:0 0 0.3rem 0;font-size:1.25rem;">🛠️ Este ejemplo muestra IndexedDB en práctica</h2>
            <p style="margin:0;opacity:0.95;">Ahora construye los tuyos: 5 retos progresivos para dominar la API.</p>
        </div>
        <a href="retos.html" style="background:white;color:#006266;padding:0.7rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:bold;white-space:nowrap;">Ir a los retos →</a>
    </div>
</body>
</html>
