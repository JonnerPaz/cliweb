<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear y Eliminar Elementos con JavaScript</title>
    <link rel="stylesheet" href="../../assets/base.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div style="max-width:1100px;margin:1rem auto 0;padding:0 1.5rem;font-size:0.9rem;">
        <a href="../index.html" style="color:#8e44ad;text-decoration:none;">← Clase 3</a>
        &nbsp;|&nbsp;
        <strong>DOM · Agregación y Eliminación</strong>
        &nbsp;·&nbsp;
        <a href="retos.html" style="color:#8e44ad;font-weight:bold;text-decoration:none;">🛠️ Ir a los retos</a>
    </div>
    <div class="container">
        <h1>Crear y Eliminar Elementos con JavaScript</h1>

        <!-- Botones para crear y eliminar elementos -->
        <button id="createElement">Crear Elemento</button>
        <button id="removeElement">Eliminar Elemento</button>

        <!-- Contenedor donde se agregarán los elementos creados -->
        <div id="elementContainer"></div>
    </div>

    <div style="max-width:1100px;margin:2rem auto 1rem;padding:1.5rem 1.75rem;background:linear-gradient(135deg,#8e44ad,#af7ac5);color:white;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,0.12);">
        <div>
            <h2 style="margin:0 0 0.3rem 0;font-size:1.25rem;">🛠️ ¿Listo para manipular el DOM?</h2>
            <p style="margin:0;opacity:0.95;">5 retos progresivos: seleccionar, modificar, crear, eliminar y reaccionar a cambios.</p>
        </div>
        <a href="retos.html" style="background:white;color:#8e44ad;padding:0.7rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:bold;white-space:nowrap;">Ir a los retos →</a>
    </div>

    <script>
        // Obtener referencia a los botones y al contenedor
        const createElementButton = document.getElementById('createElement');
        const removeElementButton = document.getElementById('removeElement');
        const elementContainer = document.getElementById('elementContainer');

        // Variable para llevar un control de los elementos creados
        let elementCount = 0;

        // Crear un nuevo elemento
        createElementButton.addEventListener('click', () => {
            elementCount++; // Incrementar el contador de elementos
            const newElement = document.createElement('div');
            newElement.classList.add('new-element');
            newElement.id = `element-${elementCount}`;

            // Crear el contenido dentro del nuevo elemento
            const text = document.createElement('p');
            text.textContent = `Este es el elemento número ${elementCount}`;
            newElement.appendChild(text);

            // Añadir el nuevo elemento al contenedor
            elementContainer.appendChild(newElement);
        });

        // Eliminar el último elemento creado
        removeElementButton.addEventListener('click', () => {
            const lastElement = elementContainer.lastElementChild;
            if (lastElement) {
                elementContainer.removeChild(lastElement); // Eliminar el último hijo
                elementCount--; // Decrementar el contador de elementos
            } else {
                alert('No hay elementos para eliminar.');
            }
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .container {
            text-align: center;
        }

        button {
            margin: 10px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #2ecc71;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        #elementContainer {
            margin-top: 20px;
        }

        .new-element {
            margin: 10px;
            padding: 20px;
            background-color: #3498db;
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .new-element p {
            margin: 0;
            font-size: 18px;
        }
    </style>
</body>

</html>
