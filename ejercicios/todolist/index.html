<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom title</title>
    <link href="css/style.css" rel="stylesheet" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header class="header"><h1>Todo List</h1></header>
    <main class="todo-list">
      <section class="todo-list-writable">
        <form class="todo-list-form">
          <input
            class="todo-list-input"
            type="text"
            placeholder="Write your task here"
          />
          <button type="submit" class="todo-list-btn">Add</button>
        </form>
      </section>

      <section class="todo-list-items-container">
        <ul class="todo-list-items">
          <li class="todo-list-item todo-list-item--empty">
            <span class="todo-list-item-text">No items here...</span>
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <span>&copy; Created by Jonner Paz</span>
    </footer>
  </body>
</html>
